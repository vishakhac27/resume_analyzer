<!DOCTYPE html>
<html>
<head>
    <title>Assessment History</title>
</head>
<body>

<h1>Assessment History</h1>

<table border="1">

<tr>
    <th>Name</th>
    <th>Career</th>
    <th>Score</th>
    <th>Date</th>
</tr>

{% for row in records %}
<tr>
    <td>{{ row.name }}</td>
    <td>{{ row.career }}</td>
    <td>{{ row.score }}</td>
    <td>{{ row.created_at }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
